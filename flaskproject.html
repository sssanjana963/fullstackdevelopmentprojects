<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Flask Info Form</title>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #a8edea, #fed6e3);
      text-align: center;
      margin-top: 100px;
    }
    form {
      background: #fff;
      width: 350px;
      margin: auto;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }
    input, button {
      padding: 10px;
      font-size: 16px;
      border-radius: 6px;
      border: 1px solid #ccc;
      margin: 8px 0;
      width: 90%;
    }
    button {
      background: #007bff;
      color: white;
      cursor: pointer;
      border: none;
    }
    button:hover {
      background: #0056b3;
    }
  </style>
</head>
<body>
  <h2>👤 Personal Info Form</h2>
  <form action="/submit" method="post">
    <input type="text" name="name" placeholder="Enter your name" required><br>
    <input type="number" name="age" placeholder="Enter your age" required><br>
    <input type="email" name="email" placeholder="Enter your email" required><br>
    <button type="submit">Submit</button>
  </form>
</body>
</html>
